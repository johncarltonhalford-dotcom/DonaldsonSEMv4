<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Southeast Territory — Donaldson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --sans:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --navy:#0B2E4F; --navy-2:#13406A; --signal:#FFC20E; --signal-ink:#3A2C00;
  --steel:#D9DFE2; --steel-dot:#C3CBD0;
  --panel:#FFFFFF; --panel-2:#F2F4F5; --panel-3:#E6EAEC;
  --ink:#14212B; --ink-2:#4A5862; --ink-3:#7C8891;
  --rule:#DDE2E5; --rule-2:#C5CDD2;
  --blue:#00539B; --up:#0E7A45; --down:#B42318;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#08131D; --navy-2:#122233; --steel:#0E151A; --steel-dot:#1B252C;
  --panel:#151D23; --panel-2:#1C262D; --panel-3:#25313A;
  --ink:#E4E9EC; --ink-2:#AAB6BE; --ink-3:#7D8A93;
  --rule:#26323A; --rule-2:#34424C; --blue:#6CB4F2; --up:#4DC48A; --down:#F07B72; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#08131D; --navy-2:#122233; --steel:#0E151A; --steel-dot:#1B252C;
  --panel:#151D23; --panel-2:#1C262D; --panel-3:#25313A;
  --ink:#E4E9EC; --ink-2:#AAB6BE; --ink-3:#7D8A93;
  --rule:#26323A; --rule-2:#34424C; --blue:#6CB4F2; --up:#4DC48A; --down:#F07B72; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;font:400 15px/1.4 var(--sans);color:var(--ink);background:var(--navy);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.n{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-columns:1fr 440px;grid-template-rows:auto 1fr}

/* ---------- command strip ---------- */
#top{grid-column:1/-1;background:var(--navy);color:#EAF1F7;display:flex;align-items:center;gap:20px;padding:10px 16px 10px 14px;min-height:62px}
.mark{display:flex;align-items:center;gap:12px;flex:none}
.mark img{height:40px;width:auto;display:block}
.mark .sep{width:1px;align-self:stretch;margin:4px 2px;background:#2C5378}
.mark h1{font:600 21px/1 var(--cond);letter-spacing:.01em}
.mark p{font-size:12.5px;color:#9FB4C7;margin-top:3px}
.find{flex:1;max-width:420px;position:relative}
.find input{width:100%;height:40px;border-radius:4px;border:1px solid #2C5378;background:#0F3A62;padding:0 36px 0 38px;color:#fff;outline:0}
:root[data-theme="dark"] .find input{background:#0E1C29;border-color:#24384B}
.find input::placeholder{color:#8EA7BE}
.find input:focus{border-color:var(--signal);background:#0B2E4F}
.find input::-webkit-search-cancel-button{display:none}
.find>svg{position:absolute;left:11px;top:11px;color:#8EA7BE}
.find button{position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:3px;color:#8EA7BE;display:grid;place-items:center}
.find button[hidden]{display:none}
.figs{display:flex;gap:0;margin-left:auto;flex:none;cursor:pointer}
.fig{padding:0 18px;border-left:1px solid #24496E}
.fig:first-child{border-left:0}
.fig b{display:block;font:600 24px/1 var(--cond);color:#fff;font-variant-numeric:tabular-nums}
.fig b.up{color:#6BE0A4}.fig b.down{color:#FF9A8F}
.fig span{font-size:12px;color:#9FB4C7}
.srcbtn{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:4px;border:1px solid #2C5378;color:#EAF1F7;font-weight:500;font-size:14px}
.srcbtn:hover{border-color:#5F87AE}
.srcbtn i{width:9px;height:9px;border-radius:50%;background:var(--signal)}
.srcbtn i.ok{background:#4CD08E}

/* ---------- map ---------- */
#stage{position:relative;overflow:hidden;background-color:var(--steel);
  background-image:radial-gradient(var(--steel-dot) 1.1px,transparent 1.3px);background-size:18px 18px;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}#map.hot{cursor:pointer}
#tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);padding:7px 10px;border-radius:3px;font-size:13.5px;line-height:1.3;
  transform:translate(-50%,calc(-100% - 14px));white-space:nowrap;max-width:320px;z-index:5}
#tip[hidden]{display:none}
#tip b{font-weight:600;display:block}
#tip small{opacity:.75;font-size:12.5px}
.mapbar{position:absolute;left:14px;top:14px;display:flex;gap:10px;z-index:4;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--rule-2);border-radius:4px;overflow:hidden}
.seg button{white-space:nowrap;height:34px;padding:0 13px;font-size:14px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button:hover{color:var(--ink);background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg .lab{display:flex;align-items:center;padding:0 10px;font-size:12.5px;color:var(--ink-3);background:var(--panel-2)}
.tools{position:absolute;right:14px;bottom:16px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule-2);border-radius:4px;z-index:4}
.tools button{width:38px;height:38px;display:grid;place-items:center;color:var(--ink-2)}
.tools button+button{border-top:1px solid var(--rule)}
.tools button:hover{background:var(--panel-2);color:var(--ink)}
#key{position:absolute;left:14px;bottom:16px;z-index:4;background:var(--panel);border:1px solid var(--rule-2);border-radius:4px;padding:6px;display:flex;flex-wrap:wrap;gap:2px;max-width:calc(100% - 90px)}
#key button{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:3px;font-size:13px;color:var(--ink)}
#key button:hover{background:var(--panel-2)}
#key button i{width:11px;height:11px;border-radius:50%;flex:none}
#key button[aria-pressed="false"]{color:var(--ink-3);text-decoration:line-through}
#key button[aria-pressed="false"] i{opacity:.25}
#key .gr{width:130px;height:9px;border-radius:2px}
#key span{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;padding:0 6px;gap:6px}

/* ---------- ledger ---------- */
#ledger{background:var(--panel);border-left:1px solid var(--rule-2);display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--rule);flex:none}
.tabs button{flex:1;height:46px;font:600 16px/1 var(--cond);color:var(--ink-3);border-bottom:3px solid transparent;letter-spacing:.01em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--signal)}
.tabs button small{font:600 12px/18px var(--cond);display:inline-block;min-width:20px;height:18px;border-radius:9px;background:var(--panel-3);color:var(--ink-2);margin-left:6px;vertical-align:2px}
.filt{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--rule);flex:none;flex-wrap:wrap;align-items:center}
.tg{height:30px;padding:0 11px;border-radius:15px;border:1px solid var(--rule-2);font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.tg:hover{border-color:var(--ink-3);color:var(--ink)}
.tg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
.tg .st{color:var(--signal)}
.filt select{margin-left:auto;height:30px;border:1px solid var(--rule-2);border-radius:15px;background:var(--panel);padding:0 10px;font-size:13.5px;cursor:pointer}
.sum{padding:8px 14px;font-size:13px;color:var(--ink-3);border-bottom:1px solid var(--rule);flex:none;display:flex;justify-content:space-between}
.list{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain;contain:strict}
.acct{border-bottom:1px solid var(--rule)}
.ah{display:grid;grid-template-columns:4px 1fr auto;gap:0 12px;width:100%;text-align:left;padding:12px 14px 11px 0;align-items:center}
.ah:hover{background:var(--panel-2)}
.ah .sp{align-self:stretch;background:transparent}
.acct.open .ah .sp{background:var(--signal)}
.ah .nm{font-weight:600;font-size:15.5px;line-height:1.25;display:flex;align-items:center;gap:7px;min-width:0}
.ah .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ah .mt{font-size:13px;color:var(--ink-3);margin-top:2px;display:flex;gap:10px}
.ah .val{text-align:right}
.ah .val b{font:600 18px/1 var(--cond);font-variant-numeric:tabular-nums;display:block}
.ah .val small{font:600 13.5px/1.3 var(--cond)}
.bars{grid-column:2/4;margin-top:8px;display:grid;gap:2px}
.bars i{display:block;height:4px;border-radius:1px;background:var(--blue)}
.bars i+i{background:var(--rule-2);height:3px}
.tier{font:700 12px/18px var(--cond);width:18px;height:18px;border-radius:2px;text-align:center;color:#fff;flex:none}
.tier.A{background:#0B6B4A}.tier.B{background:#1F4FB0}.tier.C{background:#6B6560}
.br{display:grid;grid-template-columns:12px 1fr auto;gap:0 10px;align-items:center;width:100%;text-align:left;padding:8px 14px 8px 18px;border-top:1px dashed var(--rule)}
.br:hover{background:var(--panel-2)}
.br.on{background:var(--panel-3)}
.br .dt{width:10px;height:10px;border-radius:50%}
.br .dt.ap{background:transparent!important;border:2.5px solid}
.br b{font-weight:500;font-size:14.5px;display:block;line-height:1.3}
.br small{color:var(--ink-3);font-size:12.5px}
.br .r{font:600 14.5px/1 var(--cond);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink-2)}
.br .r em{font-style:normal;display:block;font:500 12px/1.3 var(--sans);color:var(--ink-3)}
.star{color:#D99A00}
:root[data-theme="dark"] .star{color:var(--signal)}
.empty{padding:36px 22px;color:var(--ink-2);text-align:center}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:4px;border:1px solid var(--rule-2);font-weight:600;font-size:14px;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--signal);border-color:var(--signal);color:#1E1700}
.btn.go:hover{filter:brightness(1.05)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.warn{color:var(--down)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- drawer ---------- */
#drawer{position:absolute;inset:47px 0 0 0;background:var(--panel);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease-out;z-index:3}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:4px;padding:6px 6px 0;flex:none}
.dh .gap{flex:1}
.ib{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;color:var(--ink-2)}
.ib:hover{background:var(--panel-2);color:var(--ink)}
.ib[disabled]{opacity:.3;pointer-events:none}
.dbody{flex:1;overflow:auto;min-height:0;overscroll-behavior:contain}
.dtop{padding:4px 18px 16px}
.dcat{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.dcat i{width:10px;height:10px;border-radius:50%}
.dtop h2{font:600 28px/1.05 var(--cond);margin:6px 0 4px;letter-spacing:-.005em}
.dtop .sub{color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12.5px;font-weight:600;height:22px;padding:0 8px;border-radius:2px;display:inline-flex;align-items:center;background:var(--panel-3);color:var(--ink-2)}
.chip.A{background:#0B6B4A;color:#fff}.chip.B{background:#1F4FB0;color:#fff}.chip.C{background:#6B6560;color:#fff}
.chip.wb{background:transparent;box-shadow:inset 0 0 0 1px var(--down);color:var(--down)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.acts>*{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px;font-size:13px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--rule)}
.acts>*:first-child{border-left:0}
.acts>*:hover{background:var(--panel-2);color:var(--ink)}
.acts .on{color:var(--ink);background:var(--panel-2)}
.acts .on svg{color:#D99A00;fill:currentColor}
.acts [aria-disabled="true"]{opacity:.35;pointer-events:none}
.blk{padding:16px 18px;border-bottom:1px solid var(--rule)}
.blk h3{font:600 15px/1 var(--cond);letter-spacing:.02em;color:var(--ink-3);margin-bottom:12px;display:flex;justify-content:space-between}
.big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big b{font:600 40px/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big span{font:600 17px/1 var(--cond)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--rule)}
.trio div{padding:10px 0 0}
.trio b{font:600 19px/1.1 var(--cond);display:block;font-variant-numeric:tabular-nums}
.trio span{font-size:12.5px;color:var(--ink-3)}
.share{margin-top:14px;font-size:13px;color:var(--ink-2)}
.share .tr{height:6px;background:var(--panel-3);border-radius:1px;margin-top:6px}
.share .tr i{display:block;height:100%;background:var(--blue);border-radius:1px}
.note{font-size:14px;color:var(--ink-2);background:var(--panel-2);border-left:3px solid var(--signal);padding:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fld label{font-size:12.5px;color:var(--ink-3)}
.fld input,.fld textarea{border:1px solid var(--rule-2);border-radius:3px;padding:8px 10px;background:var(--panel);outline:0;width:100%}
.fld input:focus,.fld textarea:focus{border-color:var(--ink)}
.fld textarea{min-height:92px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px}
.dl dt{color:var(--ink-3)}
.dl dd a,.dl dd button{color:var(--blue);text-align:left}
.ml{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 0;border-top:1px solid var(--rule)}
.ml:first-of-type{border-top:0}
.ml i{width:9px;height:9px;border-radius:50%;flex:none}
.ml span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ml em{font-style:normal;font:600 14px/1 var(--cond);color:var(--ink-2)}
.ml:hover span{color:var(--blue)}

.fine{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.acref{background:var(--panel-2)}
.arow2{display:flex;align-items:center;gap:12px}
.arow2>div:first-child{flex:1;min-width:0}
.arow2 b{display:block;font-weight:600}
.arow2 small{font-size:12.5px;color:var(--ink-3)}
.arow2 .av{text-align:right}.arow2 .av b{font:600 22px/1 var(--cond);font-variant-numeric:tabular-nums}

/* ---------- view switch + insights ---------- */
.views{display:flex;gap:2px;background:#0F3A62;border:1px solid #2C5378;border-radius:5px;padding:3px;flex:none}
:root[data-theme="dark"] .views{background:#0E1C29;border-color:#24384B}
.views button{height:32px;padding:0 14px;border-radius:3px;font:600 15px/1 var(--cond);letter-spacing:.02em;color:#9FB4C7}
.views button:hover{color:#fff}
.views button[aria-pressed="true"]{background:var(--signal);color:#1E1700}
#app.ins #stage,#app.ins #ledger{display:none}
#insights{grid-column:1/-1;grid-row:2;overflow:auto;background:var(--steel);display:none;min-height:0}
#app.ins #insights{display:block}
.ins-in{max-width:1480px;margin:0 auto;padding:22px 22px 40px}
.ins-hd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.ins-hd h2{font:600 34px/1 var(--cond);letter-spacing:-.005em}
.ins-hd p{color:var(--ink-2);font-size:14px;margin-top:6px}
.ins-hd .gap{flex:1}
.igrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{grid-column:span 6;background:var(--panel);border:1px solid var(--rule-2);border-radius:4px;padding:16px 18px 14px;min-width:0;position:relative}
.card.w12{grid-column:span 12}.card.w4{grid-column:span 4}.card.w8{grid-column:span 8}
.card h3{font:600 19px/1.1 var(--cond);letter-spacing:.01em}
.card .cs{font-size:13px;color:var(--ink-3);margin-top:3px}
.card .ch{margin-top:12px}
.card svg{display:block;overflow:visible}
.card .lock{position:absolute;inset:56px 18px 18px;display:grid;place-items:center;text-align:center;color:var(--ink-2);font-size:14px;background:var(--panel)}
.heroes{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--rule-2);border-radius:4px;background:var(--panel);margin-bottom:14px}
.heroes div{padding:14px 18px;border-left:1px solid var(--rule)}
.heroes div:first-child{border-left:0;box-shadow:inset 4px 0 0 var(--signal)}
.heroes b{display:block;font:600 32px/1 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.heroes>div>span{font-size:13px;color:var(--ink-3)}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--ink-2)}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#itip{position:fixed;pointer-events:none;z-index:40;background:var(--ink);color:var(--panel);padding:8px 11px;border-radius:3px;font-size:13.5px;line-height:1.35;max-width:300px;transform:translate(-50%,calc(-100% - 12px))}
#itip[hidden]{display:none}
#itip b{display:block;font-weight:600}
.hov{cursor:pointer}
.hov:hover{opacity:.82}
svg text{font-family:var(--sans)}
svg .tc{font-family:var(--cond);font-weight:600}
.igrid .card{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.igrid .card:nth-child(2){animation-delay:.04s}.igrid .card:nth-child(3){animation-delay:.08s}.igrid .card:nth-child(4){animation-delay:.12s}
.igrid .card:nth-child(5){animation-delay:.16s}.igrid .card:nth-child(6){animation-delay:.2s}.igrid .card:nth-child(7){animation-delay:.24s}.igrid .card:nth-child(8){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:1100px){.card,.card.w4,.card.w8{grid-column:span 12}.heroes{grid-template-columns:repeat(3,1fr)}.heroes div:nth-child(4){border-left:0}}
@media (max-width:900px){#insights{grid-row:2/4}.views button{padding:0 10px}}
@media (max-width:560px){.heroes{grid-template-columns:repeat(2,1fr)}.heroes div:nth-child(odd){border-left:0}.heroes b{font-size:24px}.ins-in{padding:14px 12px 30px}}

/* ---------- activity log ---------- */
.lgh{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.comp{border:1px solid var(--rule-2);border-top:3px solid var(--signal);border-radius:4px;padding:12px;margin-bottom:14px;background:var(--panel)}
.comp h4{font:600 15px/1 var(--cond);margin-bottom:10px}
.types{display:flex;border:1px solid var(--rule-2);border-radius:4px;overflow:hidden;margin-bottom:10px}
.types label{flex:1;cursor:pointer}
.types input{position:absolute;opacity:0;pointer-events:none}
.types span{display:block;text-align:center;padding:7px 4px;font-size:13.5px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--rule)}
.types label:first-child span{border-left:0}
.types input:checked+span{background:var(--ink);color:var(--panel)}
.types input:focus-visible+span{outline:2px solid var(--signal);outline-offset:-2px}
.qs{display:flex;gap:4px}
.qs button{flex:1;height:38px;border:1px solid var(--rule-2);border-radius:3px;font-size:13px;color:var(--ink-2)}
.qs button:hover{border-color:var(--ink-3);color:var(--ink)}
.cb{display:flex;gap:8px;flex-wrap:wrap}
.cb .warn{margin-left:auto}
.fuopen{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:3px;background:var(--panel-2);font-size:14px;margin-bottom:12px}
.fuopen.late{box-shadow:inset 3px 0 0 var(--down)}
.fuopen.soon{box-shadow:inset 3px 0 0 var(--signal)}
.mo{font:600 13px/1 var(--cond);color:var(--ink-3);letter-spacing:.04em;padding:14px 0 6px;border-bottom:1px solid var(--rule)}
.ent{display:grid;grid-template-columns:48px 1fr;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);position:relative}
.ent.flash{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:rgba(255,194,14,.28)}100%{background:transparent}}
.edate{text-align:center;border-left:3px solid var(--tc);padding-left:4px}
.edate b{display:block;font:600 24px/1 var(--cond);font-variant-numeric:tabular-nums}
.edate span{font-size:11.5px;color:var(--ink-3)}
.et{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);flex-wrap:wrap}
.ty{font:600 12.5px/20px var(--cond);padding:0 7px;border-radius:2px;color:#fff;background:var(--tc);letter-spacing:.02em}
.et .ed2{margin-left:auto;font-size:13px;color:var(--blue);font-weight:500;padding:2px 4px}
.et .ed2:hover{text-decoration:underline}
.en{font-size:14.5px;line-height:1.45;margin-top:5px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.en.full{display:block}
.en.mute{color:var(--ink-3);font-style:italic;cursor:default}
.fu{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:600;padding:2px 7px;border-radius:2px;background:var(--panel-3);color:var(--ink-2)}
.fu.late{background:rgba(180,35,24,.12);color:var(--down)}
.fu.soon{background:rgba(255,194,14,.22);color:var(--ink)}
.fu.done{text-decoration:line-through;opacity:.6}
.em{display:block;font-size:11.5px;color:var(--ink-3);margin-top:5px}
.tabs button small.hot{background:var(--down);color:#fff}
.akpi{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--rule);flex:none}
.akpi div{padding:10px 12px;border-left:1px solid var(--rule)}
.akpi div:first-child{border-left:0}
.akpi b{display:block;font:600 22px/1 var(--cond);font-variant-numeric:tabular-nums}
.akpi span{font-size:12px;color:var(--ink-3)}
.akpi b.down{color:var(--down)}
.arow{display:grid;grid-template-columns:44px 1fr;gap:10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule)}
.arow:hover{background:var(--panel-2)}
.arow .edate b{font-size:20px}
.arow h5{font-size:14.5px;font-weight:600;line-height:1.25}
.arow h5 small{font-weight:400;color:var(--ink-3)}
.arow p{font-size:13.5px;color:var(--ink-2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.sech{font:600 14px/1 var(--cond);letter-spacing:.03em;color:var(--ink-3);padding:14px 14px 8px;display:flex;justify-content:space-between;align-items:center}
.amo{font:600 13px/1 var(--cond);color:var(--ink-3);letter-spacing:.04em;padding:12px 14px 6px;background:var(--panel-2);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:1}
.seg2{display:inline-flex;border:1px solid var(--rule-2);border-radius:15px;overflow:hidden}
.seg2 button{height:28px;padding:0 10px;font-size:13px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--rule)}
.seg2 button:first-child{border-left:0}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

/* ---------- route ---------- */
.stop{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.stop .k{width:24px;height:24px;border-radius:2px;background:var(--ink);color:var(--panel);display:grid;place-items:center;font:700 13px/1 var(--cond)}
.stop small{display:block;color:var(--ink-3);font-size:12.5px}
.stop .c{display:flex}
.rfoot{border-top:1px solid var(--rule);padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;flex:none}
.rfoot p{flex:1 1 100%;font-size:13px;color:var(--ink-2)}

/* ---------- modal / toast ---------- */
#scrim{position:fixed;inset:0;background:rgba(6,16,26,.5);display:grid;place-items:center;padding:16px;z-index:20}
#scrim[hidden]{display:none}
.modal{background:var(--panel);border-radius:6px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto}
.modal header{display:flex;align-items:center;padding:16px 10px 6px 20px}
.modal header h2{flex:1;font:600 22px/1 var(--cond)}
.modal .bd{padding:4px 20px 20px}
.modal p{color:var(--ink-2);font-size:14px}
.drop{border:2px dashed var(--rule-2);border-radius:4px;padding:20px;text-align:center;margin:14px 0 10px;cursor:pointer;color:var(--ink-2);font-size:14px}
.drop b{display:block;color:var(--ink);font-size:16px}
.drop:hover,.drop.ov{border-color:var(--signal);background:var(--panel-2)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-radius:4px;padding:11px 13px;margin-bottom:8px}
.opt:hover{border-color:var(--ink-3)}
.opt.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--signal)}
.opt b{display:block}.opt small{color:var(--ink-2);font-size:13px}
.unm{margin-top:6px;font-size:12.5px;color:var(--ink-2);max-height:96px;overflow:auto}
.row3{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:4px;font-size:14px;z-index:30;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
#toast button{color:var(--signal);font-weight:600}
#dropall{position:fixed;inset:0;z-index:25;background:rgba(11,46,79,.85);color:#fff;display:grid;place-items:center;font:600 26px/1 var(--cond);pointer-events:none}
#dropall[hidden]{display:none}

@media (max-width:900px){
  .views{order:2}
  #app{grid-template-columns:1fr;grid-template-rows:auto minmax(260px,46%) 1fr}
  #top{flex-wrap:wrap;gap:10px 14px;padding:10px 12px}
  .mark p{display:none}.mark img{height:30px}
  .find{order:5;flex:1 1 100%;max-width:none}
  .figs{margin-left:auto}.fig{padding:0 10px}.fig b{font-size:19px}
  .srcbtn{display:none}
  .seg .lab{display:none}.seg button{padding:0 10px;font-size:13px;white-space:nowrap}
  #ledger{border-left:0;border-top:1px solid var(--rule-2)}
  #key{display:none}
  .mapbar{left:10px;top:10px}
}
@media (max-width:520px){.fig:nth-child(1){display:none}.mark h1{font-size:18px}.fig b{font-size:17px}.fig span{font-size:11px}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
</style>
</head>

/* ================================================================

const LOCS=ROWS.map((r,i)=>{const [n,c,addr,lat,lng,ph,rt,rc,sub,status,acct,abc,bg,branch,approx]=r;
  const m=addr.match(/([A-Za-z .'-]+),\s*([A-Z]{2})(?:\s+\d{5})?\s*$/);

const BY={};LOCS.forEach(l=>{const k=l.acct||"~P";(BY[k]=BY[k]||[]).push(l)});

const P0=st.get(LS.prefs,{});
const S={q:"",cust:!!P0.cust,plan:!!P0.plan,pri:!!P0.pri,wb:!!P0.wb,sort:P0.sort||"val",mode:P0.mode||"cat",
  hidden:{cat:new Set(P0.hcat||[]),abc:new Set(P0.habc||[]),size:new Set(P0.hsize||[])},

const SALES={mode:"none",match:{},unmatched:[],meta:null,rows:0};
function fig(k){if(!k||k==="~P")return null;if(SALES.mode==="snapshot"){const a=ACCOUNTS[k];return{ty:a[2],py:a[3],chg:a[4],mg:a[5]}}return SALES.mode==="pdf"?SALES.match[k]||null:null}
const live=()=>SALES.mode!=="none";
const nz=s=>(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const corp=s=>nz(s).replace(/^THE/,"").replace(/(INCORPORATED|INC|LLC|CO|COMPANY|CORP|GROUP)+$/,"");
function same(a,b){const x=nz(a),y=nz(b);if(!x||!y)return false;if(x===y)return true;
  if(x.length>=8&&y.length>=8&&(x.startsWith(y)||y.startsWith(x)))return true;const x2=corp(a),y2=corp(b);return x2.length>=6&&x2===y2}
function usePdf(entries){const m=new Map(entries);SALES.match={};SALES.unmatched=[];SALES.rows=m.size;
  Object.keys(BY).forEach(k=>{if(k==="~P")return;let hit=null;for(const [nm,d] of m)if(same(nm,ACCOUNTS[k][0])){hit=d;break}
    hit?SALES.match[k]={ty:hit.ty,py:hit.py,chg:hit.chg_pct,mg:hit.margin}:SALES.unmatched.push(ACCOUNTS[k][1])});SALES.mode="pdf"}

/* ================================================================

   ================================================================ */
let NOTES=st.get(LS.notes,{})||{};
const C={ref:null,ok:false,t:0};
const note=l=>NOTES[l.key]||null;
/* Activity log model: NOTES[key] = {priority, log:[{id,date,type,contact,notes,next,created,updated,deleted?}], updated}
   lastVisit / contact / notes are derived from the newest entry (kept for search, sort and CSV). */
const TYPES=["Visit","Call","Email","Meeting"],TYC={Visit:"#00539B",Call:"#0E7A45",Email:"#7A4FC4",Meeting:"#B07800"};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toLocaleDateString("en-CA");
const addDays=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toLocaleDateString("en-CA")};
const byNew=(a,b)=>b.date.localeCompare(a.date)||(b.created||"").localeCompare(a.created||"");
function norm(n){if(!n||typeof n!=="object")return null;if(!Array.isArray(n.log)){n.log=[];
  if(n.notes||n.lastVisit||n.contact){const t=n.updated||new Date().toISOString();n.log.push({id:uid(),date:n.lastVisit||t.slice(0,10),type:"Visit",contact:n.contact||"",notes:n.notes||"",next:"",created:t,updated:t})}}return n}
function derive(n){const ls=n.log.filter(e=>!e.deleted).sort(byNew);n.lastVisit=ls[0]?ls[0].date:"";n.notes=ls[0]?ls[0].notes:"";n.contact=(ls.find(e=>e.contact)||{}).contact||"";return n}
const LOG=l=>((note(l)||{}).log||[]).filter(e=>!e.deleted).sort(byNew);
Object.keys(NOTES).forEach(k=>{if(!norm(NOTES[k]))delete NOTES[k];else derive(NOTES[k])});
function putNote(l,p){const n=derive(norm(Object.assign({priority:false,log:[]},NOTES[l.key]||{},p,{updated:new Date().toISOString()})));
  (n.priority||n.log.length)?NOTES[l.key]=n:delete NOTES[l.key];st.set(LS.notes,NOTES);push()}
function saveEntry(l,e){e=Object.assign({},e);if(!e.id)delete e.id;const n=norm(Object.assign({priority:false,log:[]},NOTES[l.key]||{})),now=new Date().toISOString(),log=n.log.slice(),i=log.findIndex(x=>x.id===e.id);
  if(i>=0)log[i]=Object.assign({},log[i],e,{updated:now});else log.push(Object.assign({id:uid(),created:now},e,{updated:now}));putNote(l,{log});return i>=0?e.id:log[log.length-1].id}
function setDeleted(l,id,del){const n=NOTES[l.key];if(!n)return;const log=n.log.map(x=>x.id===id?Object.assign({},x,{deleted:del,updated:new Date().toISOString()}):x);putNote(l,{log})}
function mergeNote(a,b){b=norm(JSON.parse(JSON.stringify(b)));if(!b)return a;if(!a)return derive(b);a=norm(JSON.parse(JSON.stringify(a)));
  const m=new Map(a.log.map(e=>[e.id,e]));b.log.forEach(e=>{const c=m.get(e.id);if(!c||(e.updated||"")>(c.updated||""))m.set(e.id,e)});
  const o=(b.updated||"")>(a.updated||"")?Object.assign({},a,b):Object.assign({},b,a);o.log=[...m.values()];return derive(o)}
function push(){if(!C.ok)return;clearTimeout(C.t);C.t=setTimeout(()=>C.ref.set({notes:NOTES,route:S.route,at:new Date().toISOString()}).catch(()=>{}),1000)}
async function cloud(){if(!window.claude||!claude.use)return;try{const [db,u]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!u)return;
  const id=await u.id();if(!id)return;C.ref=db.doc("data/users/"+id+"/territory");const s=await C.ref.get();
  if(s.exists){const d=s.data()||{};let ch=false;for(const [k,v] of Object.entries(d.notes||{})){const before=JSON.stringify(NOTES[k]||null);NOTES[k]=mergeNote(NOTES[k],v);if(JSON.stringify(NOTES[k])!==before)ch=true}
    if(!S.route.length&&Array.isArray(d.route)){S.route=d.route.filter(i=>LOCS[i]);ch=true}
    if(ch){st.set(LS.notes,NOTES);refresh()}}
  C.ok=true;push()}catch(e){}}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $$=(v,s)=>{if(v==null||isNaN(v))return"—";const a=Math.abs(v),sg=v<0?"−":"";if(s){if(a>=1e6)return sg+"$"+(a/1e6).toFixed(2)+"M";if(a>=1e3)return sg+"$"+(a/1e3).toFixed(a>=1e5?0:1)+"K"}return sg+"$"+Math.round(a).toLocaleString("en-US")};

function pass(l){
  if(S.hidden.cat.has(l.c)||S.hidden.abc.has(l.abc||"none")||S.hidden.size.has(l.status))return false;
  if(S.cust&&l.status==="PROSPECT")return false;
  if(S.plan&&!l.abc)return false;
  if(S.wb&&l.status!=="WINBACK")return false;
  const n=note(l);if(S.pri&&!(n&&n.priority))return false;
  if(!S.q)return true;
  const a=l.acct?ACCOUNTS[l.acct]:null;
  const h=(l.n+" "+l.sub+" "+l.addr+" "+(a?a[0]+" "+a[1]:"")+" "+(l.bg||"")+" "+(n&&n.log?n.log.filter(e=>!e.deleted).map(e=>e.notes+" "+e.contact+" "+e.type).join(" "):"")).toLowerCase();
  return S.q.toLowerCase().split(/\s+/).every(t=>h.includes(t));
}

/* ================================================================

const Z0=8,TILE=256;
const mx=lng=>(lng+180)/360,my=lat=>{const s=Math.sin(lat*Math.PI/180);return .5-Math.log((1+s)/(1-s))/(4*Math.PI)};
const OX=mx(-84),OY=my(32),W0=TILE*2**Z0;
const proj=(lng,lat)=>[(mx(lng)-OX)*W0,(my(lat)-OY)*W0];
LOCS.forEach(l=>{const p=proj(l.lng,l.lat);l.x=p[0];l.y=p[1]});

const G={land:new Path2D(),county:new Path2D(),border:new Path2D(),r1:new Path2D(),r2:new Path2D(),cty:[],places:[],shields:[]};
function addRing(path,ring,close){ring.forEach((p,i)=>{const q=proj(p[0],p[1]);i?path.lineTo(q[0],q[1]):path.moveTo(q[0],q[1])});if(close)path.closePath()}
(function build(){
  BASEMAP.counties.forEach(c=>{c.p.forEach(r=>{addRing(G.land,r,true);addRing(G.county,r,true)});
    const r=c.p[0];let x=0,y=0;r.forEach(p=>{x+=p[0];y+=p[1]});const q=proj(x/r.length,y/r.length);G.cty.push([c.n,q[0],q[1]])});
  Object.values(BASEMAP.borders).forEach(ls=>ls.forEach(l=>addRing(G.border,l,false)));
  const seen={};
  BASEMAP.roads.forEach(([k,nm,c])=>{addRing(k===1?G.r1:G.r2,c,false);
    const num=nm.replace(/\D/g,"");if(k===1&&num&&c.length>2){const m=c[c.length>>1],cell=num+":"+Math.round(m[0]/1.1)+":"+Math.round(m[1]/1.1);
      if(!seen[cell]){seen[cell]=1;const q=proj(m[0],m[1]);G.shields.push([num,q[0],q[1]])}}});
  const have=new Set();
  BASEMAP.places.forEach(([n,lng,lat,pop])=>{have.add(n.toLowerCase());const q=proj(lng,lat);G.places.push([n,q[0],q[1],pop>=300000?6:pop>=120000?7:pop>=50000?8:9,pop>=120000?1:0])});
  const tw={};LOCS.forEach(l=>{if(l.city&&!have.has(l.city.toLowerCase())){const t=tw[l.city]=tw[l.city]||[0,0,0];t[0]++;t[1]+=l.x;t[2]+=l.y}});
  Object.entries(tw).forEach(([n,t])=>G.places.push([n,t[1]/t[0],t[2]/t[0]-3,9.5,0]));
})();

    V.z=anim.z0+(anim.z1-anim.z0)*e;const k0=2**(anim.z0-Z0),k1=2**(anim.z1-Z0),k=kz();

  if(anim||dirty)raf=requestAnimationFrame(frame)}

  const w=Math.max(c-a,1),h=Math.max(d-b,1);const k=Math.min((V.w-pad*2)/w,(V.h-pad*2-40)/h);
  flyTo((a+c)/2,(b+d)/2+ (20/ (k||1)),Math.min(maxZ,Z0+Math.log2(k)))}
let homed=false;
function homeView(){if(V.w<50||V.h<50)return;homed=true;const a=proj(-87.9,35.1),b=proj(-80.8,29.85);
  const k=Math.min((V.w-50)/(b[0]-a[0]),(V.h-(V.w<700?80:200))/(b[1]-a[1]));V.x=(a[0]+b[0])/2;V.y=(a[1]+b[1])/2+(V.w<700?0:30)/k;V.z=Z0+Math.log2(k);req()}

let HITS=[],hover=null;
const FONT=(w,s,f)=>`${w} ${s}px ${f==="c"?'"Barlow Condensed","Arial Narrow",sans-serif':'"Barlow",system-ui,sans-serif'}`;
function draw(){
  const c=cx,k=kz(),d=V.dpr,W=V.w,H=V.h;

  const T=(ox=0,oy=0)=>c.setTransform(d*k,0,0,d*k,d*(W/2-V.x*k+ox),d*(H/2-V.y*k+oy));
  // die-cut plate: hard offset shadow, fill, edge
  const off=Math.max(4,Math.min(10,2+V.z*.7));
  T(off,off);c.fillStyle=PAL.shadow;c.fill(G.land);
  T();c.fillStyle=PAL.plate;c.fill(G.land);
  c.save();c.clip(G.land);
  if(V.z>=6.5){c.strokeStyle=PAL.county;c.lineWidth=(V.z>=9?1.1:.8)/k;c.stroke(G.county)}
  c.lineCap="round";c.lineJoin="round";
  if(V.z>=8){c.strokeStyle=PAL.r2;c.lineWidth=1.4/k;c.stroke(G.r2)}
  const rw=V.z>=9?3.2:V.z>=7.5?2.4:1.6;
  c.strokeStyle=PAL.r1c;c.lineWidth=(rw+2)/k;c.stroke(G.r1);
  c.strokeStyle=PAL.r1;c.lineWidth=rw/k;c.stroke(G.r1);
  c.restore();
  c.strokeStyle=PAL.border;c.lineWidth=1.3/k;c.setLineDash([]);c.stroke(G.border);

  // labels (screen space)
  c.setTransform(d,0,0,d,0,0);c.textAlign="center";c.textBaseline="middle";
  const boxes=[],lbls=[];const ov=(L,x,y,w,h)=>{for(const b of L)if(x<b[2]&&x+w>b[0]&&y<b[3]&&y+h>b[1])return true;return false};
  const free=(x,y,w,h,pri)=>{if(ov(lbls,x,y,w,h)||(!pri&&ov(boxes,x,y,w,h)))return false;lbls.push([x,y,x+w,y+h]);return true};
  // reserve marker boxes later; states first
  if(V.z<8){c.font=FONT(600,Math.round(16+(V.z-6)*3),"c");c.fillStyle=PAL.st;
    [["G E O R G I A",-83.4,32.4],["A L A B A M A",-86.7,32.6],["F L O R I D A",-82.4,29.9]].forEach(([n,lo,la])=>{const p=proj(lo,la),s=toScreen(p[0],p[1]);c.fillText(n,s[0],s[1])})}

  // route line
  if(S.route.length>1){c.beginPath();S.route.forEach((id,i)=>{const s=toScreen(LOCS[id].x,LOCS[id].y);i?c.lineTo(s[0],s[1]):c.moveTo(s[0],s[1])});
    c.strokeStyle=PAL.ring;c.lineWidth=6;c.stroke();c.strokeStyle=PAL.line;c.lineWidth=2;c.setLineDash([2,5]);c.stroke();c.setLineDash([])}

  // account spokes
  const focus=S.open&&S.open!=="~P"?S.open:null;
  if(focus){const ms=BY[focus].filter(l=>S.visSet.has(l.id));if(ms.length>1){const hub=ms.slice().sort((a,b)=>b.branch-a.branch)[0],hs=toScreen(hub.x,hub.y);
    c.strokeStyle=color(hub);c.globalAlpha=.55;c.lineWidth=1.5;ms.forEach(l=>{if(l===hub)return;const s=toScreen(l.x,l.y);c.beginPath();c.moveTo(hs[0],hs[1]);c.lineTo(s[0],s[1]);c.stroke()});c.globalAlpha=1}}

  // markers + clustering (world-anchored grid)
  HITS=[];const sc=Math.min(1.9,Math.max(1,(V.z-5)/3.2)),cell=40,clusterOn=V.z<11.5&&!focus;
  const groups=new Map();const M=40;
  for(const l of S.vis){const s=toScreen(l.x,l.y);if(s[0]<-M||s[1]<-M||s[0]>W+M||s[1]>H+M)continue;
    if(clusterOn){const key=Math.floor(l.x*k/cell)+":"+Math.floor(l.y*k/cell);let g=groups.get(key);if(!g){g=[];groups.set(key,g)}g.push([l,s])}
    else groups.set(l.id,[[l,s]])}
  const singles=[],clusters=[];
  groups.forEach(g=>g.length===1?singles.push(g[0]):clusters.push(g));
  singles.sort((a,b)=>SIZES[a[0].status][1]-SIZES[b[0].status][1]);
  for(const [l,s] of singles){
    const dim=focus&&l.acct!==focus,r=SIZES[l.status][1]*sc,col=color(l),n=note(l);

    if(n&&n.priority){c.beginPath();c.arc(s[0],s[1],r+4.2,0,6.2832);c.strokeStyle="#FFC20E";c.lineWidth=2.2;c.stroke()}
    c.globalAlpha=1;

  // route numbers
  S.route.forEach((id,i)=>{const s=toScreen(LOCS[id].x,LOCS[id].y);const x=s[0]+9,y=s[1]-14;c.fillStyle=PAL.line;c.fillRect(x-8,y-8,16,16);
    c.fillStyle=PAL.ring;c.font=FONT(700,12,"c");c.fillText(i+1,x,y+.5)});

  const lab=(t,x,y,f,col,pri)=>{c.font=f;const w=c.measureText(t).width+6,h=14;if(x<0||x>W||y<0||y>H)return;if(!free(x-w/2,y-h/2,w,h,pri))return;

  for(const [n,x,y,mz,big] of G.places){if(V.z<mz)continue;const s=toScreen(x,y);lab(n,s[0],s[1]-14,FONT(big?600:500,big?15:13,"c"),big?PAL.lab:PAL.lab2,big)}
  if(V.z>=8.2){c.font=FONT(700,11,"c");for(const [n,x,y] of G.shields){const s=toScreen(x,y);const w=c.measureText(n).width+8;
    if(s[0]<0||s[0]>W||s[1]<0||s[1]>H||!free(s[0]-w/2,s[1]-8,w,16,0))continue;

}

/* ---------- interaction ---------- */
const ptrs=new Map();let drag=null,moved=0,lastTap=0;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);anim=null;moved=0;
  if(ptrs.size===1)drag={x:e.offsetX,y:e.offsetY,vx:V.x,vy:V.y};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];drag={pinch:Math.hypot(a[0]-b[0],a[1]-b[1]),z:V.z,mid:[(a[0]+b[0])/2,(a[1]+b[1])/2],vx:V.x,vy:V.y}}});
cv.addEventListener("pointermove",e=>{
  if(ptrs.has(e.pointerId)){ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);
    if(drag&&drag.pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const dz=Math.log2(Math.hypot(a[0]-b[0],a[1]-b[1])/drag.pinch);
      const w=toWorld(drag.mid[0],drag.mid[1]);V.z=Math.max(6,Math.min(15,drag.z+dz));const w2=toWorld(drag.mid[0],drag.mid[1]);V.x+=w[0]-w2[0];V.y+=w[1]-w2[1];moved=99;req();return}
    if(drag&&!drag.pinch){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
      if(moved>3){cv.classList.add("drag");$("#tip").hidden=true;const k=kz();V.x=drag.vx-dx/k;V.y=drag.vy-dy/k;req()}}return}
  const h=hit(e.offsetX,e.offsetY);if(h!==hover){hover=h;cv.classList.toggle("hot",!!h);showTip(h)}else if(h)placeTip(h)});
const end=e=>{ptrs.delete(e.pointerId);cv.classList.remove("drag");
  if(!ptrs.size){if(moved<=3&&drag&&!drag.pinch)tap(e.offsetX,e.offsetY);drag=null}else if(ptrs.size===1){const [p]=[...ptrs.values()];drag={x:p[0],y:p[1],vx:V.x,vy:V.y}}};
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
cv.addEventListener("pointerleave",()=>{if(hover){hover=null;showTip(null)}});
cv.addEventListener("wheel",e=>{e.preventDefault();anim=null;const w=toWorld(e.offsetX,e.offsetY);
  V.z=Math.max(6,Math.min(15,V.z-e.deltaY*(e.ctrlKey?.012:.0022)));const w2=toWorld(e.offsetX,e.offsetY);V.x+=w[0]-w2[0];V.y+=w[1]-w2[1];req()},{passive:false});
cv.addEventListener("dblclick",e=>{const w=toWorld(e.offsetX,e.offsetY);zoomAt(e.offsetX,e.offsetY,V.z+1)});
function zoomAt(sx,sy,z){z=Math.max(6,Math.min(15,z));const w=toWorld(sx,sy),k=2**(z-Z0);flyTo(w[0]-(sx-V.w/2)/k,w[1]-(sy-V.h/2)/k,z,320)}
function hit(x,y){let best=null,bd=1e9;for(const h of HITS){const d=Math.hypot(h.x-x,h.y-y);if(d<=h.r&&d<bd){bd=d;best=h}}return best}
function tap(x,y){const h=hit(x,y);if(!h){if(S.sel!=null&&!$("#drawer").classList.contains("on")){S.sel=null;req()}return}
  if(h.g){const xs=h.g;const w=xs.length;let a=1e9,b=1e9,c=-1e9,d=-1e9;xs.forEach(l=>{a=Math.min(a,l.x);b=Math.min(b,l.y);c=Math.max(c,l.x);d=Math.max(d,l.y)});
    if(c-a<.02&&d-b<.02){zoomAt(h.x,h.y,12.5)}else fitBox(xs,13.5,80);return}
  pick(h.l.id,{fly:false})}
function showTip(h){if(!h){tip.hidden=true;return}
  if(h.g){const accts=new Set(h.g.map(l=>l.acct).filter(Boolean));tip.innerHTML=`<b>${h.g.length} locations</b><small>${accts.size} accounts. Click to zoom in</small>`}
  else{const l=h.l,f=fig(l.acct);tip.innerHTML=`<b>${esc(l.n)}</b><small>${esc(l.sub)}${l.branch?" — "+$$(l.branch,1)+" branch":f?" — "+$$(f.ty,1)+" account":""}</small>`}
  tip.hidden=false;placeTip(h)}

$("#zin").onclick=()=>zoomAt(V.w/2,V.h/2,V.z+1);$("#zout").onclick=()=>zoomAt(V.w/2,V.h/2,V.z-1);

  if(S.mode==="abc"){dim="abc";items=Object.entries(TIERS).map(([id,[n,c]])=>[id,n,c])}

  if(dim)k.innerHTML=items.map(([id,n,c])=>`<button data-k="${id}" data-d="${dim}" aria-pressed="${!S.hidden[dim].has(id)}" title="Show or hide"><i style="background:${c}"></i>${esc(n)}</button>`).join("");
  else k.innerHTML=live()?`<span>−50%</span><span class="gr" style="background:linear-gradient(90deg,${yoyC(-50)},${yoyC(0)},${yoyC(50)})"></span><span>+50% YoY</span><span><i style="width:10px;height:10px;border-radius:50%;background:#A7B0B6;display:inline-block"></i>No sales match</span>`

function apply(){if(S.view==="ins")setTimeout(renderIns,0);
  S.vis=LOCS.filter(pass);S.visSet=new Set(S.vis.map(l=>l.id));
  renderFigs();renderKey();renderList();req();savePrefs();
  document.querySelectorAll(".tg").forEach(b=>b.setAttribute("aria-pressed",!!S[b.dataset.f]));
}
function groups(){
  const out=[];
  for(const [k,ls] of Object.entries(BY)){const vis=ls.filter(l=>S.visSet.has(l.id));if(!vis.length)continue;
    const f=fig(k),branch=vis.reduce((s,l)=>s+l.branch,0);
    out.push({k,ls:vis,all:ls,f,branch,name:k==="~P"?"Prospects":ACCOUNTS[k][1],abc:vis.find(l=>l.abc)?.abc||null})}
  const v=g=>g.k==="~P"?-2e9:(g.f?g.f.ty:g.branch);
  const by={val:(a,b)=>v(b)-v(a),grow:(a,b)=>((b.f&&b.f.chg)??-1e9)-((a.f&&a.f.chg)??-1e9)||v(b)-v(a),
    stale:(a,b)=>{const lt=g=>g.k==="~P"?-1:Math.max(...g.ls.map(l=>{const d=ago((note(l)||{}).lastVisit);return d==null?1e6:d}));return lt(b)-lt(a)||v(b)-v(a)},
    drop:(a,b)=>(((a.f&&a.f.ty-a.f.py)??1e12)-((b.f&&b.f.ty-b.f.py)??1e12)),name:(a,b)=>a.k==="~P"?1:b.k==="~P"?-1:a.name.localeCompare(b.name)};
  return out.sort(by[S.sort]||by.val);
}
function branchRow(l){const n=note(l),dd=n&&ago(n.lastVisit);
  return `<button class="br${S.sel===l.id?" on":""}" data-id="${l.id}"><span class="dt${l.approx?" ap":""}" style="background:${color(l)};border-color:${color(l)}"></span>
    <span><b>${n&&n.priority?'<span class="star">★</span> ':""}${esc(l.acct?l.sub:l.n)}</b><small>${esc(l.acct?l.city:l.sub)}${l.approx?" (city-level)":""}${dd!=null?` — last activity ${dd?dd+"d ago":"today"}`:""}</small></span>
    <span class="r">${l.branch?$$(l.branch,1):l.status==="WINBACK"?'<span class="down">$0</span>':""}<em>${l.status==="PROSPECT"?"":l.branch?"branch":SIZES[l.status][0].split(",")[0]}</em></span></button>`}
function renderList(){

function optimize(){const p=S.route.map(i=>LOCS[i]),o=[p[0]],r=p.slice(1);while(r.length){const t=o[o.length-1];let bi=0,bd=1e9;r.forEach((q,i)=>{const d=mi(t,q);if(d<bd){bd=d;bi=i}});o.push(r.splice(bi,1)[0])}

    g+=`<g class="hov" data-acct="${a.k}" data-tip="<b>${ta(a.name)}</b>TY ${$$(a.f.ty)}<br>PY ${$$(a.f.py)}<br>${pc(a.f.chg)}"><rect x="0" y="${y-rh/2}" width="${w}" height="${rh}" style="fill:transparent"/>
      <text x="${lft-10}" y="${y+4}" text-anchor="end" font-size="13" style="fill:var(--ink)">${esc(short(a.name,Math.floor(lft/7.2)))}</text>
      <line x1="${xp}" x2="${xt}" y1="${y}" y2="${y}" stroke-width="3" style="stroke:${c};opacity:.45"/>
      <circle cx="${xp}" cy="${y}" r="5" stroke-width="2" style="fill:var(--panel);stroke:var(--ink-3)"/><circle cx="${xt}" cy="${y}" r="6" style="fill:${c}"/>
      <text class="tc" x="${Math.max(xt,xp)+12}" y="${y+4}" font-size="13" style="fill:${c}">${pc(a.f.chg)}</text></g>`});
  return`<svg width="${w}" height="${H}">${g}</svg><div class="lgd"><span><i style="background:transparent;box-shadow:inset 0 0 0 2px var(--ink-3);border-radius:50%"></i>Prior year</span><span><i style="background:var(--up);border-radius:50%"></i>This year, grew</span><span><i style="background:var(--down);border-radius:50%"></i>This year, declined</span></div>`}

function chBubble(A,w){
  const rows=A.filter(a=>a.f&&a.f.ty>0);if(!rows.length)return"";
  const H=340,l=46,r=14,t=14,b=34,lo=Math.log10(Math.max(1000,Math.min(...rows.map(a=>a.f.ty))*.7)),hi=Math.log10(Math.max(...rows.map(a=>a.f.ty))*1.4),Y0=-100,Y1=160;
  const X=v=>l+(Math.log10(v)-lo)/(hi-lo)*(w-l-r),Y=v=>t+(Y1-Math.max(Y0,Math.min(Y1,v)))/(Y1-Y0)*(H-t-b),mxT=Math.max(...rows.map(a=>a.f.ty));
  let g=`<rect x="${l}" y="${t}" width="${w-l-r}" height="${Y(0)-t}" style="fill:var(--up);opacity:.05"/><rect x="${l}" y="${Y(0)}" width="${w-l-r}" height="${H-b-Y(0)}" style="fill:var(--down);opacity:.05"/>`;
  [-100,-50,0,50,100,150].forEach(v=>{const y=Y(v);g+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" style="stroke:${v?"var(--rule)":"var(--ink-3)"}"/><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11.5" style="fill:var(--ink-3)">${v>0?"+":""}${v}%</text>`});
  [1e3,1e4,1e5,1e6].forEach(v=>{if(Math.log10(v)<lo||Math.log10(v)>hi)return;const x=X(v);g+=`<line x1="${x}" x2="${x}" y1="${t}" y2="${H-b}" style="stroke:var(--rule)"/><text x="${x}" y="${H-b+18}" text-anchor="middle" font-size="11.5" style="fill:var(--ink-3)">${tickFmt(v)}</text>`});
  g+=`<text x="${w-r}" y="${H-2}" text-anchor="end" font-size="11.5" style="fill:var(--ink-3)">TY sales (log scale)</text>`;
  const sorted=rows.slice().sort((a,b)=>b.f.ty-a.f.ty);
  sorted.forEach(a=>{const c=a.f.chg??0,x=X(a.f.ty),y=Y(c),rr=4+Math.sqrt(a.f.ty/mxT)*20,over=c>Y1;
    g+=`<circle class="hov" data-acct="${a.k}" cx="${x}" cy="${y}" r="${rr}" stroke-width="1.5" style="fill:${TC[a.abc]};fill-opacity:.72;stroke:var(--panel)" data-tip="<b>${ta(a.name)}</b>${$$(a.f.ty)} TY<br>${pc(a.f.chg)} YoY${a.abc!=="none"?"<br>Tier "+a.abc:""}"/>`;
    if(over)g+=`<text class="tc" x="${x}" y="${y-rr-4}" text-anchor="middle" font-size="12" style="fill:var(--up)">▲ ${pc(c)}</text>`});
  const lb=[];sorted.slice(0,w<600?6:12).forEach(a=>{const c=a.f.chg??0;if(c>Y1)return;const x=X(a.f.ty),y=Y(c),rr=4+Math.sqrt(a.f.ty/mxT)*20;
    const nm=esc(short(a.name,18)),right=x+rr+4+nm.length*6.6<w-r,tw=nm.length*6.6,bx=right?x+rr+4:x-rr-4-tw;if(lb.some(q=>bx<q[2]&&bx+tw>q[0]&&y-8<q[3]&&y+8>q[1]))return;lb.push([bx,y-8,bx+tw,y+8]);g+=`<text x="${right?x+rr+4:x-rr-4}" y="${y+4}" text-anchor="${right?"start":"end"}" font-size="12" style="fill:var(--ink-2);paint-order:stroke;stroke:var(--panel);stroke-width:3px">${nm}</text>`});
  return`<svg width="${w}" height="${H}">${g}</svg><div class="lgd">${["A","B","C","none"].map(k=>`<span><i style="background:${TC[k]};border-radius:50%"></i>${k==="none"?"No tier":"Tier "+k}</span>`).join("")}<span>Bubble size = TY sales</span></div>`}

function chPareto(A,w){
  const rows=A.filter(a=>a.f&&a.f.ty>0).sort((a,b)=>b.f.ty-a.f.ty);if(!rows.length)return"";
  const tot=rows.reduce((t,a)=>t+a.f.ty,0),H=260,l=46,r=40,t=12,b=26,bw=(w-l-r)/rows.length,mx=niceMax(rows[0].f.ty),Y=v=>t+(1-v/mx)*(H-t-b),P=p=>t+(1-p)*(H-t-b);
  let g="",cum=0,pts=[],k80=0;
  for(let i=0;i<=4;i++){const y=P(i/4);g+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" style="stroke:var(--rule)"/><text x="${w-r+6}" y="${y+4}" font-size="11.5" style="fill:var(--ink-3)">${i*25}%</text><text x="${l-8}" y="${y+4}" text-anchor="end" font-size="11.5" style="fill:var(--ink-3)">${tickFmt(mx*i/4)}</text>`}
  rows.forEach((a,i)=>{cum+=a.f.ty;const p=cum/tot,x=l+i*bw;if(!k80&&p>=.8)k80=i+1;pts.push([x+bw/2,P(p)]);
    g+=`<rect class="hov" data-acct="${a.k}" x="${x+Math.min(1.5,bw*.15)}" y="${Y(a.f.ty)}" width="${Math.max(1,bw-Math.min(3,bw*.3))}" height="${H-b-Y(a.f.ty)}" style="fill:${i<k80||!k80?"var(--blue)":"var(--rule-2)"}" data-tip="<b>#${i+1} ${ta(a.name)}</b>${$$(a.f.ty)}, ${(a.f.ty/tot*100).toFixed(1)}% of total<br>Running total ${(p*100).toFixed(0)}%"/>`});
  g+=`<polyline points="${pts.map(p=>p.join(",")).join(" ")}" fill="none" stroke-width="2.5" style="stroke:var(--signal)"/>`;
  const y80=P(.8);g+=`<line x1="${l}" x2="${w-r}" y1="${y80}" y2="${y80}" stroke-dasharray="4 4" style="stroke:var(--ink-3)"/>`;
  const top5=rows.slice(0,5).reduce((t,a)=>t+a.f.ty,0)/tot*100;
  return{svg:`<svg width="${w}" height="${H}">${g}</svg>`,sub:`${k80} of ${rows.length} accounts make 80% of sales. The top 5 alone are ${top5.toFixed(0)}%.`}}

function chDonut(A,w){
  const by={};A.forEach(a=>{const v=a.f?a.f.ty:0;if(v>0)by[a.cat]=(by[a.cat]||0)+v});const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]);if(!ent.length)return"";
  const tot=ent.reduce((t,e)=>t+e[1],0),sz=Math.min(230,w*.48),R=sz/2,ri=R*.62;let a0=-Math.PI/2,g="";
  ent.forEach(([c,v])=>{const a1=a0+v/tot*Math.PI*2,lg=a1-a0>Math.PI?1:0,p=(a,r)=>[R+r*Math.cos(a),R+r*Math.sin(a)];const [x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,ri),[x4,y4]=p(a0,ri);
    g+=`<path class="hov" d="M${x1},${y1}A${R},${R} 0 ${lg} 1 ${x2},${y2}L${x3},${y3}A${ri},${ri} 0 ${lg} 0 ${x4},${y4}Z" style="fill:${CATS[c][1]};stroke:var(--panel)" stroke-width="2" data-tip="<b>${ta(CATS[c][0])}</b>${$$(v)}, ${(v/tot*100).toFixed(1)}%"/>`;a0=a1});
  g+=`<text class="tc" x="${R}" y="${R+2}" text-anchor="middle" font-size="26" style="fill:var(--ink)">${$$(tot,1)}</text><text x="${R}" y="${R+22}" text-anchor="middle" font-size="12" style="fill:var(--ink-3)">TY sales</text>`;
  const list=ent.map(([c,v])=>`<div style="display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--rule);font-size:14px"><i style="width:12px;height:12px;border-radius:2px;background:${CATS[c][1]}"></i><span>${CATS[c][0]}</span><b class="n" style="font-size:15px">${$$(v,1)}</b><span class="n" style="color:var(--ink-3);min-width:46px;text-align:right">${(v/tot*100).toFixed(1)}%</span></div>`).join("");
  return`<div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap"><svg width="${sz}" height="${sz}">${g}</svg><div style="flex:1;min-width:200px">${list}</div></div>`}

function chMargin(A,w){
  const rows=A.filter(a=>a.f&&a.f.mg!=null&&a.f.ty>0).sort((a,b)=>b.f.ty-a.f.ty).slice(0,16).sort((a,b)=>b.f.mg-a.f.mg);if(!rows.length)return"";
  const wavg=rows.reduce((t,a)=>t+a.f.mg*a.f.ty,0)/rows.reduce((t,a)=>t+a.f.ty,0);
  const rh=22,top=6,lft=Math.min(170,w*.36),H=top+rows.length*rh+22,mx=Math.max(100,Math.ceil(Math.max(...rows.map(a=>a.f.mg))/10)*10),X=v=>lft+v/mx*(w-lft-50);
  let g="";[0,.25,.5,.75,1].forEach(p=>{const x=X(mx*p);g+=`<line x1="${x}" x2="${x}" y1="${top}" y2="${H-20}" style="stroke:var(--rule)"/><text x="${x}" y="${H-4}" text-anchor="middle" font-size="11.5" style="fill:var(--ink-3)">${Math.round(mx*p)}%</text>`});
  rows.forEach((a,i)=>{const y=top+i*rh+rh/2,x=X(a.f.mg),c=a.f.mg>=wavg?"var(--blue)":"var(--ink-3)";
    g+=`<g class="hov" data-acct="${a.k}" data-tip="<b>${ta(a.name)}</b>SM ${a.f.mg.toFixed(1)}%<br>${$$(a.f.ty)} TY"><rect x="0" y="${y-rh/2}" width="${w}" height="${rh}" style="fill:transparent"/><text x="${lft-10}" y="${y+4}" text-anchor="end" font-size="12.5" style="fill:var(--ink)">${esc(short(a.name,Math.floor(lft/7)))}</text>
      <line x1="${X(0)}" x2="${x}" y1="${y}" y2="${y}" stroke-width="2" style="stroke:${c}"/><circle cx="${x}" cy="${y}" r="5" style="fill:${c}"/><text class="tc" x="${x+10}" y="${y+4}" font-size="12.5" style="fill:var(--ink-2)">${a.f.mg.toFixed(1)}%</text></g>`});
  const xa=X(wavg);g+=`<line x1="${xa}" x2="${xa}" y1="${top-4}" y2="${H-20}" stroke-width="2" stroke-dasharray="3 3" style="stroke:var(--signal)"/>`;
  return{svg:`<svg width="${w}" height="${H}">${g}</svg>`,sub:`Top 16 accounts by sales. Dashed line is the sales-weighted average, ${wavg.toFixed(1)}%.`}}

function chPlan(w){
  const L=S.vis,tiers=["A","B","C"].map(k=>({k,v:L.filter(l=>l.abc===k).reduce((t,l)=>t+l.branch,0),n:L.filter(l=>l.abc===k&&l.branch>0).length}));
  const stK={};L.forEach(l=>{const st=(l.addr.match(/,\s*([A-Z]{2})\b/)||[])[1]||"?";const o=stK[st]=stK[st]||{v:0,n:0,c:0};o.v+=l.branch;o.n++;if(l.status!=="PROSPECT")o.c++});
  const sts=Object.entries(stK).sort((a,b)=>b[1].v-a[1].v),mx=Math.max(1,...tiers.map(t=>t.v),...sts.map(s=>s[1].v));
  const bar=(label,v,sub,col)=>`<div style="display:grid;grid-template-columns:96px 1fr 170px;gap:14px;align-items:center;padding:7px 0"><span style="font-size:14px;font-weight:500">${label}</span>
    <div style="height:18px;background:var(--panel-3);border-radius:2px;overflow:hidden" data-tip="<b>${ta(label)}</b>${$$(v)}<br>${ta(sub)}" class="hov"><div style="height:100%;width:${(v/mx*100).toFixed(1)}%;background:${col}"></div></div>
    <span class="n" style="text-align:right;font-size:15px">${$$(v,1)}<small style="display:block;font:400 11.5px/1.2 var(--sans);color:var(--ink-3)">${sub}</small></span></div>`;
  const stN={GA:"Georgia",AL:"Alabama",FL:"Florida"};
  return`<div style="font:600 14px/1 var(--cond);color:var(--ink-3);letter-spacing:.03em;margin:4px 0 2px">By A/B/C tier</div>${tiers.map(t=>bar("Tier "+t.k,t.v,t.n+" branches",TC[t.k])).join("")}
    <div style="font:600 14px/1 var(--cond);color:var(--ink-3);letter-spacing:.03em;margin:16px 0 2px">By state</div>${sts.map(([s,o])=>bar(stN[s]||s,o.v,o.c+" customer sites, "+(o.n-o.c)+" prospects","var(--blue)")).join("")}`}

function chActivity(w){
  const all=allEntries();const weeks=12,now=new Date();now.setHours(0,0,0,0);const start=new Date(now);start.setDate(start.getDate()-start.getDay()-7*(weeks-1));
  const cols=[...Array(weeks)].map((_,i)=>{const d=new Date(start);d.setDate(d.getDate()+i*7);return{d,t:{Visit:0,Call:0,Email:0,Meeting:0},n:0}});
  all.forEach(({e})=>{const d=new Date(e.date+"T00:00:00"),i=Math.floor((d-start)/6048e5);if(i>=0&&i<weeks){cols[i].t[e.type]=(cols[i].t[e.type]||0)+1;cols[i].n++}});
  const n=cols.reduce((t,c)=>t+c.n,0);if(!all.length)return`<div style="padding:30px 0;text-align:center;color:var(--ink-2)">No activity logged yet. Visits, calls and emails you log on any location show up here week by week.</div>`;
  const H=200,l=30,b=30,t=10,mx=Math.max(4,...cols.map(c=>c.n)),bw=(w-l)/weeks,Y=v=>t+(1-v/mx)*(H-t-b);let g="";
  for(let i=0;i<=mx;i+=Math.max(1,Math.ceil(mx/4))){const y=Y(i);g+=`<line x1="${l}" x2="${w}" y1="${y}" y2="${y}" style="stroke:var(--rule)"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="11.5" style="fill:var(--ink-3)">${i}</text>`}
  cols.forEach((c,i)=>{let y=H-b;const x=l+i*bw+bw*.18,ww=bw*.64;TYPES.forEach(tp=>{const v=c.t[tp];if(!v)return;const h=(H-t-b)*v/mx;y-=h;g+=`<rect x="${x}" y="${y}" width="${ww}" height="${h}" style="fill:${TYC[tp]}" data-tip="<b>Week of ${c.d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</b>${TYPES.map(k=>c.t[k]?k+": "+c.t[k]:"").filter(Boolean).join("<br>")}"/>`});
    if(i%2===0||weeks<=8)g+=`<text x="${x+ww/2}" y="${H-b+18}" text-anchor="middle" font-size="11.5" style="fill:var(--ink-3)">${c.d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}</text>`});
  const fus=openFollowups(),late=fus.filter(x=>ago(x.e.next)>0).length,touched=new Set(all.filter(x=>ago(x.e.date)<=90).map(x=>x.l.acct).filter(Boolean)).size;
  const cust=new Set(LOCS.filter(l=>l.acct).map(l=>l.acct)).size;
  return`<div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px">${[[n,"Entries, last 12 weeks"],[touched+" / "+cust,"Accounts touched, 90 days"],[fus.length,"Open follow-ups"],[late,"Overdue"]].map(([v,k],i)=>`<div><b class="n" style="font-size:26px;${i===3&&late?"color:var(--down)":""}">${v}</b><div style="font-size:12.5px;color:var(--ink-3)">${k}</div></div>`).join("")}</div>
    <svg width="${w}" height="${H}">${g}</svg><div class="lgd">${TYPES.map(k=>`<span><i style="background:${TYC[k]}"></i>${k}</span>`).join("")}</div>`}

function renderIns(){

  const T=A.reduce((t,a)=>t+(a.f?a.f.ty:0),0),P=A.reduce((t,a)=>t+(a.f?a.f.py:0),0),yy=P?(T-P)/P*100:null;
  const grew=A.filter(a=>a.f&&a.f.ty>a.f.py).length,fell=A.filter(a=>a.f&&a.f.ty<a.f.py).length,plan=S.vis.reduce((t,l)=>t+l.branch,0);

    ${filtered?'<button class="btn sm" data-act="clearf">Show all locations</button>':""}<button class="btn sm" data-act="src">Sales data</button></div>
   <div class="heroes"><div><b>${has?$$(T,1):$$(plan,1)}</b><span>${has?"TY gross sales":"FY27 plan branch $"}</span></div>
     <div><b class="${ud(yy)}">${has?pc(yy):"—"}</b><span>YoY change</span></div><div><b>${has?((T-P>=0?"+":"−")+$$(Math.abs(T-P),1)):"—"}</b><span>Dollars vs PY</span></div>
     <div><b>${A.length}</b><span>Accounts</span></div><div><b><span class="up">${grew}</span> / <span class="down">${fell}</span></b><span>Accounts up / down</span></div><div><b>${$$(plan,1)}</b><span>FY27 plan branch $</span></div></div>
   <div class="igrid">
     <div class="card w12"><h3>What moved sales from last year to this year</h3><div class="cs">Biggest account gains and losses between the prior-year and this-year totals.</div><div class="ch" id="c-wf"></div>${has?"":lock("The bridge needs TY and PY sales.")}</div>
     <div class="card"><h3>Top accounts, this year vs last</h3><div class="cs">Ranked by size. Hollow dot is prior year.</div><div class="ch" id="c-db"></div>${has?"":lock("Load sales to compare years.")}</div>
     <div class="card"><h3>Size vs growth</h3><div class="cs">Upper right are big and growing. Lower right are big accounts at risk.</div><div class="ch" id="c-bb"></div>${has?"":lock("Load sales to plot growth.")}</div>
     <div class="card"><h3>Concentration</h3><div class="cs" id="c-pa-s">Share of sales by account rank.</div><div class="ch" id="c-pa"></div>${has?"":lock("Load sales to see concentration.")}</div>
     <div class="card"><h3>Channel mix</h3><div class="cs">TY sales by account type.</div><div class="ch" id="c-dn"></div>${has?"":lock("Load sales to see the mix.")}</div>
     <div class="card"><h3>Margin by account</h3><div class="cs" id="c-mg-s">SM% for the largest accounts.</div><div class="ch" id="c-mg"></div>${has?"":lock("Load sales to see margin.")}</div>
     <div class="card"><h3>FY27 plan dollars</h3><div class="cs">Plan branch dollars by tier and by state.</div><div class="ch" id="c-pl"></div></div>
     <div class="card w12"><h3>Field activity</h3><div class="cs">Logged visits, calls, emails and meetings per week.</div><div class="ch" id="c-ac"></div></div>
   </div>`;
  const put=(id,html)=>{const n=document.getElementById(id);if(n)n.innerHTML=html};
  requestAnimationFrame(()=>{
    if(has){put("c-wf",chWaterfall(A,W("c-wf")));put("c-db",chDumbbell(A,W("c-db")));put("c-bb",chBubble(A,W("c-bb")));

    put("c-pl",chPlan(W("c-pl")));put("c-ac",chActivity(W("c-ac")));
  });
}
